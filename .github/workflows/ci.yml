name: ci

# gate — รัน check script ของทุก milestone ที่มีอยู่ (offline; check ที่ต้องใช้ thClaws/provider key
#        ต้อง skip แบบประกาศชัด ไม่ผ่านเงียบ — ดู AGENTS.md)
# lint — ruff + pytest
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run milestone gates
        run: |
          set +e
          failed=0
          skipped=0
          for f in scripts/check_*.py; do
            echo "== $f"
            python "$f"
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "SKIP: $f requires an external dependency"
              skipped=1
            elif [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          if [ "$skipped" -ne 0 ]; then echo "One or more milestone gates were explicitly skipped"; fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q || [ $? -eq 5 ]   # 5 = no tests collected (ยังไม่มี test ก่อน M1)
