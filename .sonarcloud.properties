# SonarCloud automatic-analysis settings (read from this file, not sonar-project.properties).
# Each example pack carries its own copy of the MCP stdio shell (handle + stdin loop) on purpose:
# a pack must stay copyable on its own with no shared module (docs/packs.md). Keep those three
# files out of copy-paste detection only; bugs and code smells in them are still reported.
sonar.cpd.exclusions=packs/csv-readonly/scripts/server.py,packs/datetime-tools/scripts/server.py,packs/sqlite-readonly/scripts/server.py
