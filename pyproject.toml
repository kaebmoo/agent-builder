[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-builder"
version = "0.0.1"
description = "Compile an AgentSpec into auditable thClaws agent packages for Atlas workers"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema>=4.20",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
sql-pack = ["mcp>=1.0"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools]
packages = ["forge"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
